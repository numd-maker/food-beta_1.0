<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냉장고 파먹기 쉐프 beta2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .screen { display: none; }
        .screen.active { display: block; }
        .modal { display: none; }
        .modal.active { display: flex; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative overflow-hidden">
        
        <!-- Main Screen: Ingredient Selection -->
        <div id="screen-scan" class="screen active p-6 space-y-6">
            <header class="text-center pt-8">
                <h1 class="text-3xl font-black text-orange-500">FridgeChef 7.0</h1>
                <p class="text-gray-400 mt-2" id="limitLabel">냉장고에 있는 재료를 골라주세요</p>
            </header>
            
            <div id="scanIngredients" class="flex flex-wrap gap-2 justify-center min-h-[120px] p-4 border-2 border-dashed border-gray-200 rounded-2xl bg-gray-50"></div>
            
            <button id="findBtn" onclick="goToResult()" class="hidden w-full bg-orange-500 text-white py-4 rounded-2xl font-bold hover:bg-orange-600 transition shadow-lg">요리 추천받기</button>
        </div>

        <!-- Result Screen -->
        <div id="screen-result" class="screen p-6">
            <h2 class="text-2xl font-bold mb-4">추천 요리</h2>
            <div id="resultContent" class="space-y-4"></div>
            <button onclick="location.reload()" class="w-full mt-6 bg-gray-900 text-white py-3 rounded-xl font-bold hover:bg-gray-800 transition">다시 선택하기</button>
        </div>

        <!-- Ingredient Picker -->
        <button onclick="openDictionary()" class="fixed bottom-6 left-6 bg-gray-900 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl font-bold z-40 hover:scale-105 transition">➕</button>

        <div id="modal-dictionary" class="modal fixed inset-0 bg-black/50 items-center justify-center z-50 p-4">
            <div class="bg-white w-full max-w-sm rounded-3xl p-6 relative shadow-2xl h-[90vh] flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">재료 선택</h2>
                    <button onclick="closeDictionary()" class="text-gray-400 text-2xl hover:text-black">&times;</button>
                </div>
                <div id="dictionaryList" class="overflow-y-auto flex-1 pr-2 space-y-6 text-sm"></div>
            </div>
        </div>
    </div>

    <script>
        const ingredientsData = {
            "🥩 육류": ["돼지고기","fah","소고기", "닭고기", "베이컨", "햄", "소시지", "다짐육", "차돌박이"],
            "🐟 해산물": ["오징어", "새우", "고등어", "참치캔", "바지락", "꽃게", "멸치", "갈치", "명란"],
            "🥬 채소": ["양파", "대파", "마늘", "감자", "당근", "애호박", "양배추", "시금치", "콩나물", "버섯", "고추", "배추", "오이", "무"],
            "🥚 유제품/기타": ["달걀", "우유", "치즈", "버터", "두부", "어묵", "김", "떡", "면", "쌀"],
            "🧂 소스/양념": ["간장", "고추장", "된장", "설탕", "소금", "식초", "굴소스", "케첩", "마요네즈", "참기름", "고춧가루"]
        };

        // 650개 요리 리스트 중 핵심 데이터베이스 (요리명과 필요한 핵심 재료)
        const recipesDatabase = [
            { name: "김치찌개", ingredients: ["김치", "돼지고기", "두부", "대파", "고춧가루"] },
            { name: "된장찌개", ingredients: ["된장", "두부", "애호박", "양파", "고추"] },
            { name: "제육볶음", ingredients: ["돼지고기", "양파", "고추장", "설탕", "고추"] },
            { name: "계란말이", ingredients: ["달걀", "대파", "소금"] },
            { name: "볶음밥", ingredients: ["쌀", "달걀", "양파", "간장"] },
            { name: "간장계란밥", ingredients: ["쌀", "달걀", "간장", "참기름"] },
            { name: "떡볶이", ingredients: ["떡", "고추장", "설탕", "어묵"] },
            { name: "스파게티", ingredients: ["면", "케첩", "양파", "베이컨"] },
            { name: "김치볶음밥", ingredients: ["김치", "쌀", "햄", "달걀"] },
            { name: "고등어구이", ingredients: ["고등어", "소금"] },
            { name: "된장국", ingredients: ["된장", "시금치", "두부"] },
            { name: "와와오아와오천재가만든슈퍼하이펄ㅈㄷ아이템", ingredients: ["fah", "오징어", "새우"]},
            // (요청하신 리스트의 핵심요소들을 매핑한 데이터베이스입니다)
        ];

        // UI 생성 로직
        const dictContainer = document.getElementById('dictionaryList');
        Object.entries(ingredientsData).forEach(([cat, items]) => {
            dictContainer.innerHTML += `<div><h3 class="font-bold text-orange-600 border-b pb-1 mb-2">${cat}</h3>
            <div class="flex flex-wrap gap-1">${items.map(item => `<button onclick="addIngredient('${item}')" class="text-[11px] bg-gray-50 hover:bg-orange-100 px-2 py-1.5 rounded border transition">${item}</button>`).join('')}</div></div>`;
        });

        let currentIngredients = [];
        
        function addIngredient(val) {
            if (!currentIngredients.includes(val)) {
                currentIngredients.push(val);
                renderIngredients();
            }
        }

        function renderIngredients() {
            document.getElementById('scanIngredients').innerHTML = currentIngredients.map(ing => `<span class="bg-orange-500 text-white px-3 py-1 rounded-full text-xs shadow-sm">${ing}</span>`).join('');
            document.getElementById('limitLabel').innerText = `선택된 재료: ${currentIngredients.length}개`;
            document.getElementById('findBtn').classList.remove('hidden');
        }

        function goToResult() {
            document.getElementById('screen-scan').classList.remove('active');
            document.getElementById('screen-result').classList.add('active');
            
            // 단순 추천 알고리즘: 재료가 50% 이상 포함된 요리 추천
            const recommendations = recipesDatabase.filter(recipe => {
                const matchCount = recipe.ingredients.filter(ing => currentIngredients.includes(ing)).length;
                return matchCount >= 2; // 최소 2개 이상의 재료가 일치하면 추천
            });

            const res = document.getElementById('resultContent');
            if (recommendations.length > 0) {
                res.innerHTML = recommendations.map(r => `
                    <div class="p-4 bg-white border border-orange-100 rounded-2xl shadow-sm">
                        <h3 class="font-bold text-lg text-orange-600">${r.name}</h3>
                        <p class="text-sm text-gray-500">필요 재료: ${r.ingredients.join(', ')}</p>
                    </div>
                `).join('');
            } else {
                res.innerHTML = `<p class="text-center text-gray-500 py-10">선택한 재료로 만들 수 있는 요리를 찾지 못했어요. 재료를 더 추가해보세요!</p>`;
            }
        }

        function openDictionary() { document.getElementById('modal-dictionary').classList.add('active'); }
        function closeDictionary() { document.getElementById('modal-dictionary').classList.remove('active'); }
    </script>
</body>
</html>
